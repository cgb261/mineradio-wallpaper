plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cgb261.mrwall'
    compileSdk 34

    defaultConfig {
        applicationId "com.cgb261.mrwall"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
